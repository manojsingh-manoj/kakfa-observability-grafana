services:

  alloy:
    image: grafana/alloy:latest
    container_name: event-observability-alloy

    command:
      - otel
      - --config=file:/etc/alloy/otel-config.yaml

    volumes:
      - ./otel-config.yaml:/etc/alloy/otel-config.yaml:ro

      - /Users/manojsingh/workspace/kafka-observability-grafana/logs:/var/log/order-service:ro

    ports:
      - "12345:12345"

    networks:
      - infra_default

  loki:
    image: grafana/loki:3.5.0
    container_name: event-observability-loki

    command:
      - -config.file=/etc/loki/local-config.yaml

    ports:
      - "3100:3100"

    volumes:
      - ./loki-data:/loki

    networks:
      - infra_default

  alloy-loki:
    image: grafana/alloy:latest
    container_name: event-observability-alloy-loki

    command:
      - run
      - /etc/alloy/config.alloy

    volumes:
      - ./loki-config.alloy:/etc/alloy/config.alloy:ro

    networks:
      - infra_default

  grafana:
    image: grafana/grafana:latest
    container_name: event-observability-grafana

    ports:
      - "3000:3000"

    volumes:
      - ./grafana-data:/var/lib/grafana

    networks:
      - infra_default

networks:
  infra_default:
    external: true